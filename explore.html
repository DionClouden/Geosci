<script>
    window.CESIUM_BASE_URL = "Cesium-1/Build/Cesium/";
</script>

<script>
(function () {
    const toggle = document.getElementById("layersToggle");
    const panel  = document.getElementById("explorePanel");
    if (!toggle || !panel) return;

    function setOpen(open) {
        panel.classList.toggle("is-open", open);
        toggle.classList.toggle("is-open", open);
        toggle.setAttribute("aria-expanded", open);
    }

    toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        setOpen(!panel.classList.contains("is-open"));
    });

    // tap the globe (or anywhere outside) to close
    document.addEventListener("pointerdown", (e) => {
        if (!panel.classList.contains("is-open")) return;
        if (panel.contains(e.target) || toggle.contains(e.target)) return;
        setOpen(false);
    });

    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setOpen(false);
    });

    // tidy up if the window is resized back to desktop
    window.matchMedia("(min-width: 821px)").addEventListener("change", (m) => {
        if (m.matches) setOpen(false);
    });
})();
</script>
