<script>
(function(){

{n:'The ocean closes',a:0,b:.28,cam:[.5,.6],ov:{arrows:1},t:['Two continents drift towards each other across an ocean. Cold, dense oceanic plate sinks into the mantle at a subduction zone, and its weight drags the whole plate (and the continent riding on it) towards the trench.','Water driven out of the sinking slab lowers the melting point of the mantle above, so magma rises and builds a chain of volcanoes on the overriding plate. Earthquakes trace the slab as it descends.'],look:['The sinking slab and its quake foci (red)','Water rising off the slab (blue)','The volcanic arc on the right continent','Plate motion arrows'],f:['Closing speed: roughly 2–10 cm a year','The Tethys Ocean closed over about 100 million years']},
{n:'First contact',a:.28,b:.4,cam:[.4,.5],ov:{arrows:1},t:['When the continental margin reaches the trench, trouble starts. Continental crust (about 2.7 g/cm³) is lighter than the mantle (about 3.3), so it resists being pulled down. Subduction stalls and the plates begin to lock together.','Sediments scraped off the margin are stacked into a wedge, and slivers of old ocean floor (ophiolites) get shoved up onto the continent. The suture between them marks where the ocean used to be.'],look:['Ocean basin gone, margins touching','The scraped-off wedge at the trench','Slab still attached below'],f:['Continental crust ~2.7 vs mantle ~3.3 g/cm³','Collisions slow down but do not stop: India still converges at ~4–5 cm a year']},
{n:'Shortening: folds and thrusts',a:.4,b:.56,cam:[.2,.8],ov:{faults:1,strain:1},t:['The plates keep pushing, so the crust has to go somewhere. The upper crust shortens by folding and by thrust faults that stack slices of rock on top of each other like roof tiles. Deeper, the crust flows more like putty.','Faults merge into a flat detachment (a décollement) at depth. The whole wedge self-adjusts to a critical taper, like snow piling up in front of a bulldozer.'],look:['Yellow thrust faults slicing the crust','Strain ellipses squashed horizontally and stretched vertically','Fault traces on the surface'],f:['The Alps shortened by well over 100 km','Much of India–Asia convergence (about 2,500 km) was absorbed by thickening and sideways escape of crust']},
{n:'Thickening and uplift',a:.56,b:.7,cam:[.35,.45],ov:{iso:1,arrows:1},t:['Shortening piles crust up, making it thicker. Thick, light crust floats higher on the mantle, like an iceberg, and most of the extra thickness goes downwards as a root: elevation is only about 18% of the extra crust.','Meanwhile the old oceanic slab below can break off and sink away. That removes a downward pull, and the range can pop up. Under Tibet the crust is roughly 70 km thick, twice normal.'],look:['A deep crustal root beneath the mountain','Dashed lines show sea level and normal Moho depth','The slab breaking off and falling away'],f:['Extra elevation = about 0.18 × extra crust thickness','Everest 8.8 km; Tibetan plateau about 5 km on average']},
{n:'Metamorphism and melting',a:.7,b:.8,cam:[.0,.35],ov:{heat:1},t:['Buried rocks heat up and are squeezed without melting. Their minerals recrystallise and line up, turning shale into slate, then schist, then gneiss, with telltale minerals such as garnet and kyanite marking each grade.','At the deepest, hottest levels water-bearing rock starts to melt, making granite magma that rises and cools into plutons. Some rock is even dragged down more than 80 km and comes back up (eclogite and coesite are found in the Alps and Himalaya).'],look:['The glowing heat zone under the range','Grade rising from green (low) to red and yellow (melting)','Hover the cut face for temperature and rock type'],f:['Barrovian sequence: slate → schist → gneiss','Ultra-high pressure rocks record burial to over 2.5 GPa']},
{n:'Erosion and the balance',a:.8,b:.92,cam:[.7,.55],ov:{iso:1},t:['Rain, rivers and glaciers strip material off the range while uplift keeps pushing it up. Sediment fills a basin that sags next to the mountains, the foreland basin.','Removing mass from the top lets the crust below rebound upwards, so erosion actually drives more uplift. When erosion balances uplift, the range holds a steady height for millions of years.'],look:['Rivers carving valleys into the mountain','Thick sediment wedges on both sides','Height settling as erosion catches up'],f:['Rivers can wear down several mm a year locally','About 80% of removed crust is replaced by rebound from below']},
{n:'Collapse and exhumation',a:.92,b:1,cam:[.9,.5],ov:{faults:1},t:['When the push weakens, thick hot crust can no longer hold itself up. It spreads sideways under its own weight, normal faults open at the top, and deep rocks are dragged up into domes (metamorphic core complexes).','Over hundreds of millions of years only the roots of the old mountains remain, which is what the Appalachians and Urals are: worn-down stumps of ancient collisions.'],look:['Normal faults and a sunken centre','Banded gneiss exposed at the surface','Shorter, eroded mountains'],f:['Tibet is stretching east–west today along normal faults','Deep rocks (gneiss) reach the surface by exhumation']}];

Q.sort((x,y)=>y.z-x.z);for(const q of Q){c.fillStyle=q.col;c.beginPath();c.moveTo(q.a.P[0],q.a.P[1]);c.lineTo(q.b.P[0],q.b.P[1]);c.lineTo(q.d.P[0],q.d.P[1]);c.lineTo(q.e.P[0],q.e.P[1]);c.closePath();c.fill();c.strokeStyle=q.col;c.lineWidth=.7;c.stroke()}
/* cut faces */
const y0=yc*Ly,FC=[{k:'f',n:[0,-1,0],O:[0,y0,Lz],U:[Lx,0,0],V:[0,0,-Lz],w:WF,h:HF},{k:'b',n:[0,1,0],O:[0,Ly,Lz],U:[Lx,0,0],V:[0,0,-Lz],w:WF,h:HF},{k:'l',n:[-1,0,0],O:[0,y0,Lz],U:[0,Ly-y0,0],V:[0,0,-Lz],w:WS,h:HF},{k:'r',n:[1,0,0],O:[Lx,y0,Lz],U:[0,Ly-y0,0],V:[0,0,-Lz],w:WS,h:HF}];
const vis=FC.filter(f=>{const nx=f.n[0]*cp+f.n[1]*sp,ny=-f.n[0]*sp+f.n[1]*cp;return ny*ct-f.n[2]*st2<0});
for(const f of vis){const m=pr(f.O[0]+f.U[0]/2+f.V[0]/2,f.O[1]+f.U[1]/2,f.O[2]+f.V[2]/2);f.d=m[2]}vis.sort((a,b)=>b.d-a.d);st.fm=null;
for(const f of vis){const o2=pr(...f.O),u2=pr(f.O[0]+f.U[0],f.O[1]+f.U[1],f.O[2]+f.U[2]),v2=pr(f.O[0]+f.V[0],f.O[1]+f.V[1],f.O[2]+f.V[2]),M=[(u2[0]-o2[0])/f.w,(u2[1]-o2[1])/f.w,(v2[0]-o2[0])/f.h,(v2[1]-o2[1])/f.h,o2[0],o2[1]];
c.save();c.transform(M[0],M[1],M[2],M[3],M[4],M[5]);if(f.k=='f')orog(c,f.w,f.h,pa(yc),tm,o);else if(f.k=='b')orog(c,f.w,f.h,pa(1),tm,Object.assign({},o,{strain:0,heat:0,faults:0,iso:0}));else sideFace(c,f.w,f.h,f.k=='l'?rows[0].G:rows[NY].G,f.k=='l'?0:1);c.restore();
if(f.k=='l'||f.k=='r'){c.fillStyle='rgba(0,0,0,.3)';c.beginPath();[o2,u2,[u2[0]+v2[0]-o2[0],u2[1]+v2[1]-o2[1]],v2].forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.fill()}
c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1.5;c.beginPath();[o2,u2,[u2[0]+v2[0]-o2[0],u2[1]+v2[1]-o2[1]],v2].forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.stroke();if(f.k=='f')st.fm=M}
/* overlays on the top surface */
const sf=(u,y)=>{const j=Math.min(NY,Math.max(0,Math.round((y-yc)/(1-yc)*NY))),e=rows[j].G.e(u,y);return pr(u*Lx,y*Ly,zs+(e.e+.004)*Lz)};
if(st.ov.faults){c.lineWidth=3;c.strokeStyle='rgba(255,230,120,.95)';for(const s of[-1,1]){c.beginPath();let on=0;for(let j=0;j<=NY;j++){const r=rows[j];if(r.G.col>.05){const u=.5+s*.09*(.5+r.G.col),q=sf(u,r.yn);on?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);on=1}}c.stroke()}}
if(st.ov.arrows&&P<.9)for(const s of[-1,1]){const u0=s<0?.07:.93,d=-s,pts=[[0,-.04],[.12*d,-.04],[.12*d,-.08],[.22*d,0],[.12*d,.08],[.12*d,.04],[0,.04]],ym=yc+(1-yc)*.5;c.fillStyle='rgba(184,160,106,.95)';c.beginPath();pts.forEach((q,i)=>{const p2=pr((u0+q[0]+d*Math.sin(tm*2)*.012)*Lx,(ym+q[1]*1.2)*Ly,zs+.08*Lz);i?c.lineTo(p2[0],p2[1]):c.moveTo(p2[0],p2[1])});c.closePath();c.fill()}
if(st.ov.labels){c.save();c.shadowColor='#000';c.shadowBlur=5;const ym2=yc+(1-yc)*.5,Gm=rows[Math.round(NY/2)].G;c.font='500 11px Inter,sans-serif';c.fillStyle='rgba(241,241,232,.8)';c.textAlign='center';if(Gm.col<.6){const q=sf(.64,ym2*.5+.1);c.fillText('VOLCANIC ARC',q[0],q[1]-24)}if(Gm.col>.4){const q=sf(.5,ym2);c.fillText('MOUNTAIN BELT',q[0],q[1]-22)}c.restore()}
/* probe on the cut face */
if(st.fm&&st.px>=0&&!st.drag){const M=st.fm,det=M[0]*M[3]-M[1]*M[2],X=st.px-M[4],Y=st.py-M[5],lx=(M[3]*X-M[2]*Y)/det,ly=(-M[1]*X+M[0]*Y)/det;
if(lx>=0&&lx<=WF&&ly>=0&&ly<=HF){const u=lx/WF,v=ly/HF,Gp=geo(pa(yc),o),Tt=Gp.T(u),z=Math.max(0,(v-Tt)*250);let nm='Air';

const Tc=15+18*z*(1+.45*Gp.col*Gp.bell(u)),gr=nm.includes('sedim')||nm.includes('base')?(Tc>720?'granulite / partial melt':Tc>500?'amphibolite grade':Tc>300?'greenschist grade':''):'';
tip.style.display='block';tip.style.left=Math.min(W-200,st.px+16)+'px';tip.style.top=Math.max(8,st.py-10)+'px';tip.innerHTML=`<b>${nm}</b>${v>=Tt&&!ocean?`<br>depth ≈ ${z.toFixed(0)} km · ${Math.round(Tc)} °C · ${(z*.027).toFixed(2)} GPa`:''}${gr?`<br><i>${gr}</i>`:''}`;c.strokeStyle='#ffdc78';c.lineWidth=2;c.beginPath();c.arc(st.px,st.py,5,0,TAU);c.stroke()}else tip.style.display='none'}else if(!st.drag)tip.style.display='none';
$('leg').style.display=st.ov.heat?'block':'none';
lensDraw(tm,P,o)}

/* ---------- the lens: a close-up that changes with the stage ---------- */
function lensDraw(tm,P,o){const w=380,h=210,s=st.stage;lc.setTransform(1,0,0,1,0,0);lc.globalAlpha=1;lc.fillStyle='#08100f';lc.fillRect(0,0,w,h);lc.textAlign='left';lc.font='12px Inter,sans-serif';
const cap=['Ocean width closing (schematic)','Buoyancy: why continents will not sink','Fold and thrust detail','Isostasy: floating crust','Rock texture at this grade','Uplift against erosion','Normal faults in the collapsing crust'];$('lcap').textContent=cap[s];
if(s==0){const f=cl(st.t/.34);lc.strokeStyle='rgba(241,241,232,.4)';lc.strokeRect(30,20,320,150);lc.strokeStyle='#ff7a3a';lc.lineWidth=2.5;lc.beginPath();lc.moveTo(30,30);lc.lineTo(350,160);lc.stroke();lc.fillStyle='#fff';lc.beginPath();lc.arc(30+320*f,30+130*f,5,0,TAU);lc.fill();lc.fillStyle='rgba(241,241,232,.8)';lc.fillText('ocean width ≈ '+Math.round(4000*(1-f)).toLocaleString('en-GB')+' km',40,196);lc.fillText('time ▸',300,186)}
else if(s==1){[['Oceanic crust',3.0,'#3a4a5a'],['Continental crust',2.7,'#9a8a7a'],['Mantle',3.3,'#b8420c']].forEach((b,i)=>{const bw=(b[1]-2)*210;lc.fillStyle=b[2];lc.fillRect(20,28+i*52,bw,28);lc.fillStyle='#f1f1e8';lc.fillText(b[0]+'  '+b[1].toFixed(1)+' g/cm³',26,46+i*52)});lc.fillStyle='#ffdc78';lc.fillText('lighter than the mantle: it floats',20,200);const bob=Math.sin(tm*2)*3;lc.fillStyle='#9a8a7a';lc.fillRect(300,60+bob,60,24)}
else if(s==2){const sh=cl((P-.5)/.5)*.55,N=2.5,wd=330*(1-sh*.3);let lo=0,hi=wd*.5;for(let i=0;i<12;i++){const A=(lo+hi)/2;let len=0,qx=0,qy=0;for(let k=1;k<=50;k++){const x=wd*k/50,y=A*Math.sin(TAU*N*k/50);len+=Math.hypot(x-qx,y-qy);qx=x;qy=y}len>330?hi=A:lo=A}const A=(lo+hi)/2*.5;for(let k=0;k<7;k++){lc.beginPath();for(let x=0;x<=wd;x+=6){const y=60+k*16+A*Math.sin(TAU*N*x/wd);x?lc.lineTo(25+x,y):lc.moveTo(25+x,y)}for(let x=wd;x>=0;x-=6)lc.lineTo(25+x,76+k*16+A*Math.sin(TAU*N*x/wd));lc.closePath();lc.fillStyle=BC[k%8];lc.fill()}lc.fillStyle='rgba(241,241,232,.8)';lc.fillText('shortened by '+Math.round(sh*100)+'%',25,28);lc.fillText('anticlines up, synclines down',25,196)}
else if(s==3){const d=cl((P-.7)/.3)*35,e=d*.1818,r=d-e,k=2.6,sl=70;lc.fillStyle='#b8420c';lc.fillRect(0,sl,w,h);lc.fillStyle='rgba(30,110,150,.9)';lc.fillRect(0,sl,60,4);lc.fillRect(320,sl,60,4);lc.fillStyle='#7a6a62';lc.fillRect(70,sl-e*k,240,(35+r+e)*k*.0+ (35+r)*k+e*k);lc.setLineDash([4,4]);lc.strokeStyle='#fff';lc.beginPath();lc.moveTo(60,sl+35*k);lc.lineTo(320,sl+35*k);lc.stroke();lc.setLineDash([]);lc.fillStyle='#fff';lc.fillText('extra thickness '+d.toFixed(0)+' km: stands '+e.toFixed(1)+' km up, root '+r.toFixed(1)+' km down',8,16)}
else if(s==4){const u=cl((P-.8)/.2);metaTex(lc,10,10,230,190,u,tm);lc.fillStyle='#f6dd8e';lc.font='700 13px Inter,sans-serif';lc.fillText(ROCK(u).toUpperCase(),256,40);lc.fillStyle='rgba(241,241,232,.8)';lc.font='12px Inter,sans-serif';lc.fillText('~'+Math.round(15+18*u*40)+' °C',256,62);lc.fillText('~'+(u*40*.027).toFixed(2)+' GPa',256,80)}
else if(s==5){const f=cl((st.t-.8)/.12);lc.strokeStyle='rgba(241,241,232,.4)';lc.strokeRect(30,20,320,150);lc.setLineDash([4,4]);lc.strokeStyle='#b8a06a';lc.beginPath();lc.moveTo(30,50);lc.lineTo(350,50);lc.stroke();lc.setLineDash([]);lc.strokeStyle='#ff7a3a';lc.lineWidth=2.5;lc.beginPath();for(let i=0;i<=40;i++){const x=i/40,h2=1-Math.exp(-x*3.5)*.9+.0;lc.lineTo(30+320*x,170-120*h2*.9)}lc.stroke();lc.fillStyle='#fff';const x2=f,y2=170-120*(1-Math.exp(-x2*3.5)*.9)*.9;lc.beginPath();lc.arc(30+320*x2,y2,5,0,TAU);lc.fill();lc.fillStyle='rgba(241,241,232,.8)';lc.fillText('height: rises, then levels off where erosion = uplift',25,194)}

let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1e3||.016);last=t;frame(dt,t/1e3);if(!rm)requestAnimationFrame(loop);else setTimeout(()=>requestAnimationFrame(loop),400)}
